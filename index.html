<meta charset="utf-8">
<title>Cerebro NEVOA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: splash minimalista → barra lateral carbón + contenido marfil; una vista por sección, enrutada por #hash */
:root{
  --bg:#F6F4EE;          /* marfil niebla */
  --surface:#FFFFFF;
  --panel:#EFEDE6;       /* marfil profundo */
  --ink:#24282C;         /* carbón */
  --muted:#686D66;       /* gris pizarra cálido */
  --line:#E0DDD3;
  --accent:#5E6B43;      /* verde olivo */
  --accent-soft:#E7EADC;
  --sage:#9AA58A;
  --mist:#CDD1C6;
  --side:#2B3034;        /* barra lateral carbón */
  --side-ink:#E9E7DF;
  --side-active:#3D4448;
  --on-accent:#FFFFFF;
  --good:#4F7A3A; --good-bg:#E3ECDA;
  --warn:#8C6A1C; --warn-bg:#F2EAD4;
  --bad:#93413A; --bad-bg:#F3DEDA;
  --neutral-bg:#ECEAE3;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191B; --surface:#1E2326; --panel:#1A1F21; --ink:#ECEAE2; --muted:#A3A89D; --line:#343A3D;
  --accent:#A9B783; --accent-soft:#2B3324; --sage:#7F8C6B; --mist:#4A5148; --side:#0F1214; --side-ink:#E4E2DA; --side-active:#262C2F; --on-accent:#15191B;
  --good:#9CC27F; --good-bg:#24301D; --warn:#DDB45E; --warn-bg:#352B14; --bad:#E3998D; --bad-bg:#3A2320; --neutral-bg:#2A3033;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191B; --surface:#1E2326; --panel:#1A1F21; --ink:#ECEAE2; --muted:#A3A89D; --line:#343A3D;
  --accent:#A9B783; --accent-soft:#2B3324; --sage:#7F8C6B; --mist:#4A5148; --side:#0F1214; --side-ink:#E4E2DA; --side-active:#262C2F; --on-accent:#15191B;
  --good:#9CC27F; --good-bg:#24301D; --warn:#DDB45E; --warn-bg:#352B14; --bad:#E3998D; --bad-bg:#3A2320; --neutral-bg:#2A3033;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;cursor:pointer;transition:opacity .8s ease, transform .9s cubic-bezier(.7,0,.2,1);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#splash::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,var(--surface) 0,transparent 62%);opacity:.9}
#splash.out{opacity:0;transform:scale(1.02);pointer-events:none}
.sp-inner{position:relative;display:grid;gap:16px;justify-items:center;text-align:center}
.sp-icon{width:clamp(120px,18vw,190px);height:auto}
.sp-icon .net{stroke:var(--muted);stroke-width:1.4;fill:none}
.sp-icon .node{fill:var(--ink)}
.sp-icon .node.l{fill:var(--sage)}
.sp-icon .leaf{stroke:var(--accent);stroke-width:1.6;fill:none;stroke-linecap:round}
.sp-icon path,.sp-icon line{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2s .15s ease forwards}
.sp-icon circle{opacity:0;animation:fade .5s ease forwards}
.sp-word{font-family:var(--f-display);font-size:clamp(34px,6.4vw,64px);letter-spacing:.08em;line-height:1;animation:rise .9s .3s cubic-bezier(.2,.7,.2,1) both}
.sp-tag{font-family:var(--f-display);font-size:clamp(13px,2vw,20px);letter-spacing:.14em;color:var(--ink);opacity:.85;animation:fade 1s .7s both}
.sp-bar{width:min(78vw,520px);height:10px;border-radius:999px;background:var(--neutral-bg);border:1px solid var(--line);overflow:hidden;margin-top:18px;animation:fade 1s .9s both}
.sp-bar i{display:block;height:100%;width:8%;border-radius:999px;background:linear-gradient(90deg,var(--ink),var(--muted));transition:width .5s ease}
.sp-meta{font-size:13px;color:var(--muted);min-height:20px;animation:fade 1s 1s both}
.sp-hint{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){#splash *,#splash{animation:none!important;transition:none!important}.sp-icon path,.sp-icon line{stroke-dashoffset:0}.sp-icon circle{opacity:1}}

/* ---------- Shell ---------- */
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
nav.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 14px 18px;gap:4px;overflow-y:auto}
.brand{font-family:var(--f-display);font-size:30px;letter-spacing:.06em;text-align:center;padding:0 0 22px;color:var(--side-ink);text-decoration:none}
.brand small{display:block;font-family:var(--f-body);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-top:4px}
nav.side a.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px;opacity:.85}
nav.side a.nv svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
nav.side a.nv:hover{background:var(--side-active);opacity:1}
nav.side a.nv[aria-current="page"]{background:var(--side-active);opacity:1;box-shadow:inset 3px 0 0 var(--sage)}
.side-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
.side-foot{margin-top:auto;padding:12px;font-size:11.5px;line-height:1.5;opacity:.6}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.tb-title{display:flex;align-items:center;gap:10px;min-width:0}
.tb-title svg{width:30px;height:30px;flex:none}
.tb-title strong{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.06em}
.tb-title span{display:block;color:var(--muted);font-size:12px}
.tb-tools{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,.input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);max-width:100%}
main{min-width:0;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){main{padding-left:34px;padding-right:max(34px,env(safe-area-inset-right,0px))}}
.content{min-width:0;display:flex;flex-direction:column}
.view{display:grid;gap:22px;max-width:1300px;animation:fade .35s ease}
.view-head{display:grid;gap:6px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.view-head h1{font-size:clamp(26px,3.4vw,36px)}
.view-head p{margin:0;color:var(--muted);max-width:76ch}
@media (max-width:899px){
  .layout{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;z-index:25;height:auto;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;gap:2px}
  .brand{font-size:20px;padding:0 10px 0 4px}.brand small,.side-foot,.side-sep{display:none}
  nav.side a.nv{white-space:nowrap;padding:8px 10px;font-size:13px}
  .topbar{position:static}
  .tb-title span{display:none}
}

/* ---------- Bloques ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi .k-label{font-size:12px;color:var(--muted)}
.kpi .k-val{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.kpi .k-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.panel h2{font-size:20px;margin-bottom:2px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;text-align:left;color:var(--muted);font-size:11.5px;letter-spacing:.02em;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-neutral{background:var(--neutral-bg);color:var(--muted)}
.p-accent{background:var(--accent-soft);color:var(--accent)}
.bar-row{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:11px;background:var(--neutral-bg);border-radius:3px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.note{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--sage)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-primary:hover{filter:brightness(1.15)}
.btn[disabled]{opacity:.5;cursor:default}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:8px 10px;border-radius:8px;max-width:340px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.spark path{fill:none;stroke:var(--accent);stroke-width:1.6}
.spark .area{fill:var(--accent-soft);stroke:none}
tr.is-current td{background:var(--accent-soft)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
details.abs summary{cursor:pointer;color:var(--accent);font-size:12px;list-style:none}
details.abs summary::-webkit-details-marker{display:none}
details.abs p{margin:6px 0 0;font-size:12.5px;color:var(--ink);max-width:80ch}
.pt-title{font-weight:600;text-decoration:none;color:var(--ink)}
.pt-title:hover{color:var(--accent);text-decoration:underline}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- Resumen estratégico ---------- */
.strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.strat .panel{display:grid;gap:12px;align-content:start}
.st-item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding-top:12px;border-top:1px solid var(--line)}
.st-item:first-of-type{border-top:0;padding-top:0}
.st-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;background:var(--accent-soft);color:var(--accent)}
.st-item h3{font-family:var(--f-body);font-weight:600;font-size:14.5px;margin-bottom:3px}
.st-item p{margin:0;font-size:13px}
.st-item .dec{margin-top:6px;font-size:12.5px;background:var(--panel);border-radius:8px;padding:8px 10px}
.st-item .dec b{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}

/* ---------- Scatter estilo Orange ---------- */
.orange{display:grid;grid-template-columns:260px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.o-ctrl{background:var(--panel);border-right:1px solid var(--line);padding:12px;display:grid;gap:12px;align-content:start;font-size:12.5px}
.o-box{border:1px solid var(--line);border-radius:6px;padding:10px 10px 8px;position:relative;display:grid;gap:8px;background:var(--surface)}
.o-box > .o-legend{position:absolute;top:-9px;left:8px;background:var(--panel);padding:0 4px;font-size:12px;color:var(--muted)}
.o-row{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:6px}
.o-row select{padding:4px 6px;font-size:12px;width:100%}
.o-n{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:3px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700}
.o-sel{position:relative}
.o-sel .o-n{position:absolute;left:6px;top:50%;transform:translateY(-50%);pointer-events:none}
.o-sel select{padding-left:26px}
.o-slider{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:6px}
.o-slider input{width:100%;accent-color:var(--accent)}
.o-check{display:flex;gap:8px;align-items:center;cursor:pointer}
.o-check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.o-btn{width:100%;padding:6px;border:1px solid var(--sage);background:var(--surface);border-radius:4px;cursor:pointer;font-size:12.5px}
.o-btn:hover{background:var(--accent-soft)}
.o-tools{display:flex;gap:6px}
.o-tool{width:32px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:4px;display:grid;place-items:center;cursor:pointer}
.o-tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.o-tool svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.7}
.o-plot{position:relative;min-width:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.o-plot canvas{display:block;width:100%;height:clamp(360px,58vh,600px);cursor:crosshair;touch-action:none}
.o-status{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--muted);background:var(--panel);flex-wrap:wrap}
.o-msg{color:var(--accent);font-weight:500}
@media (max-width:760px){.orange{grid-template-columns:1fr}.o-ctrl{border-right:0;border-bottom:1px solid var(--line);grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}

/* ---------- Mapa de calor ---------- */
.heat{display:grid;gap:2px;font-size:11px;min-width:640px}
.heat .h-row{display:grid;grid-template-columns:170px repeat(var(--cols),minmax(0,1fr));gap:2px;align-items:center}
.heat .h-lbl{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.heat .h-grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.heat .h-cell{height:22px;border-radius:2px}
.heat .h-yr{color:var(--muted);text-align:center;font-size:10px}

/* ---------- Familias ---------- */
.row-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.row-head > div{max-width:72ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--sage);background:var(--accent-soft)}
.fam-chips{flex-wrap:wrap}
.fam-chips .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fam-chips .chip[aria-pressed="true"] .note{color:var(--bg);opacity:.7}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.fam{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fam-top{display:flex;align-items:flex-start;gap:12px}
.score{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;background:conic-gradient(var(--c) calc(var(--s)*1%), var(--neutral-bg) 0);position:relative}
.score::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.score span{position:relative;z-index:1}
.fam h3{font-family:var(--f-body);font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.fam .holder{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.fam p{margin:0;font-size:13.5px}
.kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.action{background:var(--panel);border-radius:8px;padding:10px 12px;font-size:13.5px}
.action b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:3px}
.fam-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto}
.doclink{font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;text-decoration:none;color:var(--ink)}
.doclink:hover{border-color:var(--accent);color:var(--accent)}
.fam-ask{margin-left:auto;font-size:12.5px;padding:5px 10px}

/* ---------- Cerebro ---------- */
.brain{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1080px){.brain{grid-template-columns:1fr}}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:min(78vh,820px);min-height:500px;overflow:hidden}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chat-head h2{font-size:19px}
.chat-head .note{margin-left:auto}
.chat-log{overflow-y:auto;padding:20px;display:grid;gap:16px;align-content:start;background:var(--bg)}
.msg-q{justify-self:end;max-width:min(560px,90%);background:var(--neutral-bg);color:var(--ink);padding:11px 16px;border-radius:14px 14px 4px 14px;border:1px solid var(--line)}
.msg-a{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;max-width:900px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--side);display:grid;place-items:center}
.avatar svg{width:22px;height:22px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.bubble.dark{background:var(--side);color:var(--side-ink);border-color:var(--side)}
.bubble.dark a{color:var(--sage)}
.bubble h3{font-family:var(--f-body);font-weight:600;font-size:14px}
.bubble p{margin:0}
.bubble ul{margin:0;padding-left:20px}
.bubble .src{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.evid{display:grid;gap:8px}
.evid-item{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px}
.evid-item a{font-weight:600;text-decoration:none}
.evid-item a:hover{text-decoration:underline}
.evid-item .meta{color:var(--muted);font-size:11.5px}
mark{background:var(--accent-soft);color:var(--ink);border-radius:2px;padding:0 2px}
.composer{border-top:1px solid var(--line);padding:12px;display:grid;gap:10px;background:var(--surface)}
.composer form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.inbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 6px 0 12px}
.inbox input{border:0;background:transparent;flex:1;min-width:0;padding:11px 0;outline:none}
.inbox:focus-within{border-color:var(--accent)}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:6px;display:grid;place-items:center}
.icon-btn svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.6}
.icon-btn:hover{background:var(--accent-soft)}
.side-col{display:grid;gap:12px;align-content:start}
.side-col .panel{padding:16px}
.side-col h2{font-size:18px}
.file-list{display:grid;max-height:360px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.file{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.file:last-child{border-bottom:0}
.ficon{width:32px;height:34px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:700;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.ficon.t{background:var(--accent-soft);color:var(--accent)}
.ficon.u{background:var(--side);color:var(--side-ink)}
.file .fn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fs{font-size:11.5px;color:var(--muted)}
.ok{width:20px;height:20px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.ok svg{width:12px;height:12px;stroke:var(--surface);fill:none;stroke-width:2.6}
.drop{border:1.5px dashed var(--sage);border-radius:10px;padding:16px;text-align:center;display:grid;gap:6px;justify-items:center;color:var(--muted);font-size:12.5px;cursor:pointer}
.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.drop strong{color:var(--ink);font-weight:600}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--sage);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.bank-tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bank-tab{border:0;background:var(--surface);padding:7px 4px;cursor:pointer;font-weight:500;font-size:12.5px}
.bank-tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.bank details{border-top:1px solid var(--line);padding:6px 0}
.bank summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0;display:flex;justify-content:space-between;align-items:center}
.bank summary span{font-weight:500;font-size:11px;color:var(--muted);background:var(--neutral-bg);border-radius:999px;padding:1px 8px}
.bq-list{display:grid;gap:4px;padding:4px 0 6px}
.bq{border:0;border-left:2px solid var(--mist);background:transparent;text-align:left;padding:6px 8px;font-size:12.5px;line-height:1.4;cursor:pointer;border-radius:0 6px 6px 0}
.bq:hover{background:var(--accent-soft);border-left-color:var(--accent)}
.bq.done{border-left-color:var(--good);color:var(--muted)}
.bank-list-wrap{max-height:540px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.refs{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.ref-card{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;width:100%;min-width:0}
.ref-card:hover{border-color:var(--sage)}
.ref-card .ri{width:32px;height:32px;border-radius:8px;background:var(--neutral-bg);display:grid;place-items:center}
.ref-card .ri svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.5}
.ref-card > span:last-child{min-width:0}
.ref-card strong{display:block;font-size:12px;line-height:1.25;overflow-wrap:anywhere;hyphens:auto}
.ref-card span{font-size:11.5px;color:var(--muted)}
.cl-stop{display:none}
.chat.busy .cl-stop{display:inline-flex}
.md p{margin:0 0 8px}.md p:last-child{margin:0}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}
.md code{font-family:ui-monospace,monospace;font-size:12px;background:rgba(127,127,127,.18);border-radius:4px;padding:0 4px}
.search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-row .input{flex:1;min-width:200px}
.catalog-tbl{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px}

const TAG_ES = {regen: "regeneración y cicatrización", antiox: "antioxidantes", antimic: "antimicrobianos", clinical: "estudios clínicos", invitro: "estudios in vitro", exvivo: "ensayos ex vivo", animal: "estudios en animales", safety: "seguridad e irritación", regul: "temas regulatorios (nano, microplásticos, conservadores)", retinol: "retinol y retinoides", bakuchiol: "bakuchiol", vitc: "vitamina C", antiaging: "antienvejecimiento", depigment: "despigmentación y luminosidad", moist: "hidratación y barrera", sensitive: "piel sensible y calmante", collagen: "colágeno", peptide: "péptidos", watersol: "activos hidrosolubles", oilsol: "activos liposolubles", ph: "control de pH", vegan: "vegano y cruelty-free", chelat: "agentes quelantes", rheology: "textura y reología", photo: "fotosensibilidad y fotoestabilidad", thermo: "termolabilidad", emulsifier: "emulsionantes y tensoactivos", preserv: "conservadores y vida de anaquel", stabil: "estabilidad", sebum: "control de sebo y acné", yield: "rendimiento de extracción", tradition: "conocimiento tradicional", microbiome: "microbioma de la piel", nano: "nanotecnología"};

  const ftRows = S.ft.map((n, i) => { const ds = all.filter(d => hasFt(d, i)); const g = growthOf(ds); const lib = ds.filter(d => statusG(d) === "Libre"); const pp = S.lit.filter(p => p.tp.some(t => ts.includes(t)) && hasFt({ft: p.ftAny}, i)); return {n, i, ds, ...g, lib, pp}; });
  const trendsFt = ftRows.filter(r => r.r >= 10 && r.p >= 3).sort((a, b) => b.g - a.g).slice(0, 2);
  const tagRows = Object.keys(TAG_ES).filter(k => !/clinical|invitro|exvivo|animal|yield|ph/.test(k)).map(k => { const ds = all.filter(d => hasTag(d, k)); return {k, ds, ...growthOf(ds)}; }).filter(r => r.r >= 15).sort((a, b) => b.g - a.g);
  const tagT = tagRows[0];
  const trends = trendsFt.map(r => ({h: `${r.n}: actividad en aumento`, p: `Pasó de ${plural(r.p, "documento", "documentos")} en 2016–2020 a ${fmt(r.r)} en 2021–2025 (×${r.g.toFixed(1)}), con ${plural(r.pp.length, "artículo científico citado", "artículos científicos citados")} con DOI.`, d: r.lib.length ? `Monitorear a los titulares activos y revisar las ${fmt(r.lib.length)} patentes libres de ${r.n.toLowerCase()} antes de desarrollar desde cero.` : `Seguir a los titulares que más patentan en ${r.n.toLowerCase()} y evaluar una alianza o licencia.`}));
  if (tagT) trends.push({h: `Tema recurrente: ${TAG_ES[tagT.k]}`, p: `Es el tema que más crece en los documentos: de ${fmt(tagT.p)} a ${fmt(tagT.r)} entre ambos quinquenios (×${tagT.g.toFixed(1)}).`, d: `Incluir ${TAG_ES[tagT.k]} como criterio en el desarrollo de nuevos productos y en los claims de NEVOA.`});
  // Oportunidades
  const opps = [];
  const free = ftRows.filter(r => r.g >= 1 && r.lib.length).sort((a, b) => b.lib.length * Math.min(b.g, 2) - a.lib.length * Math.min(a.g, 2))[0];
  if (free) { const ex = free.lib.slice().sort((a, b) => b.citedBy - a.citedBy)[0]; opps.push({h: `Usar tecnología libre de ${free.n.toLowerCase()}`, p: `${plural(free.lib.length, "patente está libre", "patentes están libres")} (expiradas o abandonadas) en una tecnología que sigue creciendo (×${free.g.toFixed(1)}). La más citada es ${esc(ex.num)}: “${esc(titleCase(ex.title))}”, citada ${plural(ex.citedBy, "vez", "veces")}.`, d: `Revisar las reivindicaciones de las patentes libres más citadas y adaptar el método a una línea NEVOA sin pagar licencia, confirmando el estatus en cada oficina.`}); }
  let ings = ts.filter(i => S.topics[i].kind === "ing"); if (!ings.length) ings = S.topics.map((t, i) => t.kind === "ing" ? i : -1).filter(i => i >= 0); const cells = [];

  const ws = cells.filter(c => c.pp >= 2).sort((a, b) => b.pp / (b.pa + 1) - a.pp / (a.pa + 1))[0] || cells.sort((a, b) => a.pa - b.pa)[0];
  if (ws) opps.push({h: `${S.topics[ws.ti].name} + ${S.ft[ws.fi].toLowerCase()}`, p: `Hay ${plural(ws.pp, "artículo científico", "artículos científicos")} que vinculan este ingrediente con ${S.ft[ws.fi].toLowerCase()}, pero ${ws.pa ? `solo ${plural(ws.pa, "patente los combina", "patentes los combinan")}` : "ninguna patente los combina"} de forma explícita. La ciencia va por delante de la protección.`, d: `Desarrollar un prototipo de ${S.topics[ws.ti].name.toLowerCase()} con ${S.ft[ws.fi].toLowerCase()} y evaluar su patentabilidad: es un espacio poco protegido.`});
  const noMx = ftRows.map(r => ({...r, nm: r.ds.filter(d => isAlive(d) && !fjs(d).has("MX") && monthsSince(d.pd) > 31)})).sort((a, b) => b.nm.length - a.nm.length)[0];
  if (noMx && noMx.nm.length) opps.push({h: `${noMx.n}: tecnología vigente fuera, libre en México`, p: `${plural(noMx.nm.length, "patente vigente", "patentes vigentes")} de ${noMx.n.toLowerCase()} no se presentaron en México y ya pasó el plazo para hacerlo.`, d: `Evaluar su uso para productos que se fabriquen y vendan en México; evitar exportarlos a los países donde siguen protegidas.`});
  return {trends: trends.slice(0, 3), opps: opps.slice(0, 3)};
